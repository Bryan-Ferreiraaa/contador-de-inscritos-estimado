<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20010904//EN" "http://w3.org">
<svg version="1.1" xmlns="http://w3.org" width="768" height="768" viewBox="0 0 768 768">
  <defs>
    <!-- Máscara para prender a sombra perfeitamente dentro do círculo principal -->
    <clipPath id="limiteCirculo">
      <circle cx="384" cy="384" r="350"/>
    </clipPath>
  </defs>

  <!-- 1. Círculo Vermelho de Fundo -->
  <circle cx="384" cy="384" r="350" fill="#f44336"/>

  <!-- Todo o conteúdo abaixo fica preso dentro das bordas do círculo -->
  <g clip-path="url(#limiteCirculo)">
    
    <!-- 2. A Sombra Longa Vetorial (Desenhada perfeitamente na diagonal com 12% de opacidade) -->
    <g fill="#000000" opacity="0.12">
      <!-- Sombra da primeira linha e bolinha -->
      <polygon points="181,504 229,456 800,1027 800,1123"/>
      <!-- Sombra do corpo central do gráfico projetada até o infinito -->
      <polygon points="205,480 310,360 425,415 560,305 600,345 800,545 800,1075"/>
      <!-- Sombra complementar das curvas superiores -->
      <polygon points="310,360 425,415 800,790 800,735"/>
    </g>

    <!-- 3. O Gráfico Branco Principal (Por cima da sombra) -->
    <g stroke="#ffffff" stroke-width="32" stroke-linecap="round">
      <!-- Linhas que conectam as bolinhas -->
      <line x1="205" y1="480" x2="310" y2="360"/>
      <line x1="310" y1="360" x2="425" y2="415"/>
      <line x1="425" y1="415" x2="560" y2="305"/>
    </g>

    <!-- As 4 Bolinhas Brancas do Gráfico -->
    <g fill="#ffffff">
      <circle cx="205" cy="480" r="34"/>
      <circle cx="310" cy="360" r="34"/>
      <circle cx="425" cy="415" r="34"/>
      <circle cx="560" cy="305" r="34"/>
    </g>

  </g>
</svg>