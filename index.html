<!DOCTYPE html>
<html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<meta charset="UTF-8">
	<meta http-equiv="content-language" content="pt-br">
	<meta name="description"
		content="Acompanhe o número de inscritos estimado de qualquer canal do YouTube em tempo real!">
	<meta name="author" content="Bryan Ferreiraaa">
	<meta name="keywords" content="contador de inscritos, youtube, ao vivo, em tempo real, contador estimado">
	<meta name="google-site-verification" content="d0utPExyaIhh1eM_kMyP1MQNryWnRhi-bSmBFbPHgD8">

        <title>Contador YouTube Realtime</title>
    <!-- Importação oficial da fonte Rubik fornecida por você -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
           <div class="busca-box">
        <input type="text" id="input-id" value="UC-lHJZR3Gqxm24_Vd_AJ5Yw" placeholder="Cole o ID do canal (UC...)">
        <button onclick="mudarCanal()">Trocar Canal</button>
    </div>

    <div class="contador-card">
        <img id="canal-pfp" class="avatar" src="" alt="Avatar do Canal">
        <h2 id="nome-canal" class="canal-titulo">Carregando...</h2>
        
        <div class="numero" id="inscritos">0</div>
        <div class="label">Inscritos Estimados</div>
        
        <div class="sub-dados">
            Visualizações: <span id="views" style="color: #ffcc00; font-weight: bold;">0</span>
        </div>

        <div class="api-dados-container">
            <div class="api-bloco">
                <div class="api-titulo">Inscritos (API)</div>
                <span id="api-subs" style="font-weight: bold; color: #00ffcc;">0</span>
            </div>
            <div class="api-bloco">
                <div class="api-titulo">Visualizações (API)</div>
                <span id="api-views" style="font-weight: bold; color: #ff9900;">0</span>
            </div>
        </div>

        <div class="meta-container">
            <span id="meta-texto" style="font-weight: bold; font-size: 14px;">Calculando meta...</span>
            <div class="meta-barra-fundo">
                <div id="meta-barra" class="meta-barra-progresso"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
